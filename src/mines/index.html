<!doctype html>
<html lang="en" class="game">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mines · Games</title>
  <meta name="description" content="Open every safe square; the numbers tell you where the mines are.">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="play">
    <p class="hud"><span>Mines <b id="left">0</b></span><span id="status" aria-live="polite"></span><span>Time <b id="time">0</b></span><span>Best <b id="best">–</b></span></p>
    <div class="board fit">
      <div class="grid" role="img" aria-label="Minefield"></div>
    </div>
    <div class="controls">
      <button type="button" class="chip" id="level"></button>
      <button type="button" class="chip" id="flagMode" aria-pressed="false">🚩 Flag mode</button>
      <button type="button" class="chip" id="new">New game</button>
    </div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
