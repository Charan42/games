<!doctype html>
<html lang="en" class="game">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Snake · Games</title>
  <meta name="description" content="Eat, grow, and don't bite your own tail.">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../shared/base.css">
</head>
<body>
  <main class="play">
    <p class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></p>
    <div class="board">
      <canvas role="img" aria-label="Snake board"></canvas>
      <button type="button" class="overlay"><strong>Tap to play</strong><span>Swipe to steer · arrow keys on desktop</span></button>
    </div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
